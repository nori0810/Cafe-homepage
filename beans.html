<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>選別された豆</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="contents wrapper">
        <main id="main_content">
            <h2>おすすめの豆</h2>
            <p>ブレンドをしお楽しみください。</p>

            <div class="item-list">
                <section class="item">
                    <a href="#bear">
                    <img src="https://cdn.pakutaso.com/shared/img/thumb/CK20160626375813_TP_V4.jpg?width=500" 
                    alt="コーヒー豆">
                    <h3>ブレンドコーヒー豆</h3>
                    <p>独自のブレンドコーヒー</p>
                </a>
                </section>
                <section class="item">
                    <a href="#afternoon">
                        <img src="https://cdn.pakutaso.com/shared/img/thumb/ogasuta458A7895_TP_V4.jpg?width=500"
                         alt="herbal tea">
                         <h3>ハーブティー</h3>
                         <p>3種類のハーブティー</p>
                    </a>
                </section>
            </div>

            <div class="product-detail">
                <h2 class="bottom-title">
                    豆詳細
                </h2>
                <section id="bear" style="margin-bottom: 30px;">
                    <h3>ブレンド豆</h3>
                    <p>
                        独自の配合で豆をブレンドし、豊かな香りと深いコクを引き出しました。
                        <br> それぞれの豆の個性を活かしながら、バランスのとれた味わいに仕上げています。
                    </p>
                </section>

                <section id="afternoon" class="bottom-after">
                    <h3>ハーブティー</h3>
                    <p>
                        香りや味わいの異なる3種類のハーブティーをご用意しました。
                        <br> それぞれのハーブが持つ個性を活かした、やさしく豊かな味わいをお楽しみいただけます。
                    </p>
                </section>
                <section>
                    <div class="bottom-message">
                        <p>独自の香り</p>
                        <p>心地いい空間</p>
                        <p>Anytime</p>
                    </div>
                </section>
            </div>
                
            </div>
            
        </main>
    </div>
</body>
</html>
