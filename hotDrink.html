<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ホットコーヒー</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="contents wrapper">
        <main id="main_content">
        <h2>ホットコーヒー</h2>
        <section class="product">
        <h3>ブレンドコーヒー</h3>
        <p>
            香り豊かな豆をブレンドした、当店こだわりのコーヒーです。
            <br>
            ゆっくりと味わいながらおくつろぎください。
        </p>
        <p class="price">
            価格：300円(税込み)
        </p>
        </section>

        <section class="product">
        <h3>日替わりコーヒー</h3>
        <p>
            ブラジルやケニアなど様々な国のコーヒーが日替わりで登場！！
        </p>
        <p class="price">
            価格：300円
        </p>
        </section>
        </main>
    </div>
</body>
</html>
